syntax = "proto3";

package llm;


// ============================================================
// LLM Service
// ============================================================

service LLMService {

    // Generic LLM endpoint used by the Application Server.
    //
    // Supports:
    // 1. Auction FAQ
    // 2. Item description generation
    // 3. Auction / result summarization
    rpc GetLLMAnswer(LLMRequest) returns (LLMResponse);
}


// ============================================================
// Task Type
// ============================================================

enum LLMTaskType {

    // Used when no explicit task type is supplied.
    LLM_TASK_UNSPECIFIED = 0;

    // General auction-related chatbot / FAQ.
    AUCTION_FAQ = 1;

    // Generate an auction listing/item description.
    ITEM_DESCRIPTION = 2;

    // Summarize an ongoing auction.
    AUCTION_SUMMARY = 3;

    // Summarize a completed auction / final result.
    RESULT_SUMMARY = 4;
}


// ============================================================
// Conversation History
// ============================================================

enum MessageRole {
    MESSAGE_ROLE_UNSPECIFIED = 0;
    USER = 1;
    ASSISTANT = 2;
}

message ChatMessage {

    MessageRole role = 1;

    string content = 2;
}


// ============================================================
// Auction Context
// ============================================================

message AuctionContext {

    // Auction identifier.
    string auction_id = 1;

    // Basic item information.
    string item_name = 2;
    string item_description = 3;

    // Auction financial information.
    double starting_price = 4;
    double current_highest_bid = 5;

    // Currency code such as INR, USD etc.
    string currency = 6;

    // ACTIVE, CLOSED, UPCOMING, CANCELLED etc.
    string auction_status = 7;

    // ISO-8601 formatted times supplied by Application Server.
    string start_time = 8;
    string end_time = 9;

    // Number of bids currently placed.
    int32 bid_count = 10;

    // Winner information should only be supplied when appropriate.
    string winner_id = 11;
    double winning_bid = 12;

    // Arbitrary item-specific information.
    //
    // Examples:
    // brand -> Lenovo
    // processor -> Ryzen 7
    // ram -> 16 GB
    // condition -> Used
    map<string, string> item_attributes = 13;

    // Additional auction information which does not justify
    // changing the proto contract.
    map<string, string> additional_context = 14;
}


// ============================================================
// Generation Configuration
// ============================================================

message GenerationConfig {

    // Maximum number of tokens the model should generate.
    //
    // 0 means server default.
    int32 max_tokens = 1;

    // Model sampling temperature.
    //
    // 0 means server default.
    float temperature = 2;
}


// ============================================================
// Request
// ============================================================

message LLMRequest {

    // Unique identifier created by the Application Server.
    string request_id = 1;

    // Indicates what type of operation is required.
    LLMTaskType task_type = 2;

    // User/application instruction.
    //
    // Examples:
    // "Can bids be withdrawn?"
    // "Generate a professional description for this item."
    // "Summarize the current auction."
    string query = 3;

    // Structured auction information supplied by the
    // Application Server.
    AuctionContext auction_context = 4;

    // Optional previous conversation messages.
    //
    // Useful for context-aware FAQ/chatbot interaction.
    repeated ChatMessage conversation_history = 5;

    // Optional extra textual context for information that
    // does not naturally fit AuctionContext.
    string additional_context = 6;

    // Optional model generation settings.
    GenerationConfig generation_config = 7;
}


// ============================================================
// Error Codes
// ============================================================

enum LLMErrorCode {

    LLM_ERROR_NONE = 0;

    INVALID_REQUEST = 1;

    MODEL_UNAVAILABLE = 2;

    MODEL_INFERENCE_FAILED = 3;

    INTERNAL_ERROR = 4;
}


// ============================================================
// Response
// ============================================================

message LLMResponse {

    // Same request ID supplied in LLMRequest.
    // Useful for tracing distributed requests.
    string request_id = 1;

    // Indicates whether generation succeeded.
    bool success = 2;

    // Generated model response.
    string answer = 3;

    // Human-readable status/error information.
    string message = 4;

    // Machine-readable error information.
    LLMErrorCode error_code = 5;

    // Model actually used to produce the response.
    //
    // Example:
    // llama3.2:3b
    string model_name = 6;

    // Approximate inference latency measured by the LLM server.
    int64 processing_time_ms = 7;
}