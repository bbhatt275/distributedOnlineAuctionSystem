syntax = "proto3";

package llm;


// LLMService is the grpc service interface that  the application server calls to interact with the LLM.

service LLMService {

    //It serves as the main LLm endpoint and supports the capabalities:
    // 1. Auction FAQ
    // 2. Item description generation
    // 3. Ongoing Auction summarization
    // 4. Completed auction summarization

    rpc GetLLMAnswer(LLMRequest) returns (LLMResponse);
}
//Enums
// LLMTaskType tells the LLM which kind of job it has to perform.

enum LLMTaskType {

    // Default / invalid task.
    LLM_TASK_UNSPECIFIED = 0;

    // Answer an auction related question.
    AUCTION_FAQ = 1;

    // Generate a description for an item in the auction.
    ITEM_DESCRIPTION = 2;

    // Summarize an ongoing auction.
    AUCTION_SUMMARY = 3;

    // Summarize a completed auction and its result.
    RESULT_SUMMARY = 4;
}


// Used to establish conversation roles.

enum MessageRole {

    MESSAGE_ROLE_UNSPECIFIED = 0;

    USER = 1;

    ASSISTANT = 2;
}

//Messages and their variables
//represents a single turn in a multi turn conversation.
message ChatMessage {

    MessageRole role = 1;

    string content = 2;
}


// Auction Context
// This message intentionally does NOT reuse the Auction message from auction.proto.

// The Application Server decides which auction information is relevant and constructs this context before calling the LLM.

// This keeps the LLM service independent from AuctionService.

message AuctionContext {

    // Auction identity
    string auction_id = 1;


    // Item information
    string item_name = 2;

    string item_description = 3;


    // Pricing
    double starting_price = 4;

    double current_highest_bid = 5;

    // Example: INR, USD, EUR
    string currency = 6;


    // Auction state

    // True if the auction is currently active.
    bool active = 7;

    // Unix timestamp in seconds.
    int64 start_time = 8;

    // Unix timestamp in seconds.
    int64 end_time = 9;


    // Bidding information

    int32 bid_count = 10;

    // ID/username of the current highest bidder.
    // Application Server should only provide this when revealing it to the LLM is appropriate.

    string highest_bidder = 11;


    // Result information

    // ID/username of the winner.
    // Normally made available only for completed auctions.
    string winner = 12;

    // Final winning bid.
    double winning_bid = 13;


    // Flexible item metadata

    // Allows different item types without modifying this proto.
    //
    // Examples:
    //   brand     -> Lenovo
    //   processor -> Ryzen 7
    //   ram       -> 16 GB
    //   condition -> Used
    //

    map<string, string> item_attributes = 14;



    // Individual bid information

    // Optional.
    // The Application Server should provide these only when
    // the requested LLM task actually requires bidding history.

    repeated BidContext bids = 15;


    // Additional application-provided context
    // Used for information that may not fit naturally into the structured fields above.

    string additional_context = 16;
}


// Bid Context
// It is deliberately kept independent from auction.proto's Bid message.
// Only information useful to the LLM is included.

message BidContext {

    string bid_id = 1;

    string bidder = 2;

    double amount = 3;

    // Unix timestamp in seconds.
    int64 timestamp = 4;
}


// Requester Context

// Optional information about the user/requester.
// Warning, Do NOT put authentication tokens or passwords here.

message RequesterContext {

    // Application level user identifier if relevant.
    string user_id = 1;

    // "buyer", "seller", "admin"
    string role = 2;

    // Additional non-sensitive information relevant to answering the current request.
    string additional_context = 3;
}


// Generation Configuration
// Additional Hyperparameters passed to fine tune generations.

message GenerationConfig {

    // Maximum number of tokens to generate.
    // 0 = server default.
    int32 max_tokens = 1;

    // Sampling temperature (low for deterministic result, high for creative results)
    // 0 is the server default.
    float temperature = 2;
}


// LLM Request (Important)
// This is the primary request or query being sent from application server to the grpc LLM Service

message LLMRequest {

    // Unique ID generated by the Application Server.

    // Used for tracing a request across services.
    string request_id = 1;


    // Requested LLM operation.
    LLMTaskType task_type = 2;


    // Current user/application requestor query.
    string query = 3;


    // Relevant auction information.
    AuctionContext auction_context = 4;


    // (Optional) requester information.
    RequesterContext requester_context = 5;


    // (Optional) previous conversation.
    repeated ChatMessage conversation_history = 6;


    // Additional context that may be supplied by the Application Server.
    string additional_context = 7;


    // (Optional) Hyperparameters for tuning.
    GenerationConfig generation_config = 8;
}


// Enum for Error Codes

enum LLMErrorCode {

    // Request completed successfully (NO Error).
    LLM_ERROR_NONE = 0;

    // Request is invalid or missing required information.
    INVALID_REQUEST = 1;

    // Requested model is unavailable.
    MODEL_UNAVAILABLE = 2;

    // Model inference failed.
    MODEL_INFERENCE_FAILED = 3;

    // Internal LLM service error.
    INTERNAL_ERROR = 4;
}



// Model Usage Information

// Useful for benchmarking and reporting LLM Performance.
// Values may be zero when unavailable.

message ModelUsage {

    // Number of input/prompt tokens processed.
    int32 input_tokens = 1;

    // Number of output/generated tokens.
    int32 output_tokens = 2;
}


// LLM Response (Important)
//The response sent back by the LLM server after generation.

message LLMResponse {

    // Same request ID received in LLMRequest.
    string request_id = 1;


    // True if the LLM request was successfully processed.
    bool success = 2;


    // Generated answer or response.
    string answer = 3;


    // Human readable status or error message.
    string message = 4;


    // Machine-readable error code.
    LLMErrorCode error_code = 5;


    // Model used for this response.
    // Example:"llama3.2:3b"
    string model_name = 6;


    // Server side inference/processing time.
    int64 processing_time_ms = 7;


    // (Optional) model usage statistics.
    ModelUsage usage = 8;
}