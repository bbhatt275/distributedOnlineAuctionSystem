{% extends "base.html" %}
{% block title %}Sign in  <p class="hint">New here? <a href="/register">Create an account</a>.</p>
{% endblock %}

{% block content %}
<div class="card narrow">
  <h1>Sign in</h1>
  {% if registered %}<p class="success">Account created. You can sign in now.</p>{% endif %}
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>Username <input name="username" autocomplete="username" required autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
  </form>
</div>
  <p class="hint">New here? <a href="/register">Create an account</a>.</p>
{% endblock %}
