{% extends "base.html" %}
{% block title %}Create account{% endblock %}

{% block content %}
<div class="card narrow">
  <h1>Create account</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/register">
    <label>Username
      <input name="username" value="{{ username }}" minlength="3" maxlength="32"
             pattern="[A-Za-z0-9_-]+" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <input name="password" type="password" minlength="8"
             autocomplete="new-password" required>
    </label>
    <label>Confirm password
      <input name="confirm_password" type="password" minlength="8"
             autocomplete="new-password" required>
    </label>
    <button type="submit">Create account</button>
  </form>
  <p class="hint"><a href="/login">Back to sign in</a></p>
</div>
{% endblock %}
