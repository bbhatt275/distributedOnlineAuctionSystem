services:
  node1:
    build: .
    command: python -m application.server
    environment:
      NODE_ID: 1
      PORT: 50051
      RAFT_DB_PATH: /data/raft.db
      AUTH_DB_PATH: /authdata/users.db
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      LLM_SERVER_ADDRESS: ${LLM_SERVER_ADDRESS:-llm:50052}
    ports:
      - "50051:50051"
    volumes:
      - node1_data:/data
      - auth_data:/authdata
    depends_on:
      - llm
    restart: unless-stopped

  node2:
    build: .
    command: python -m application.server
    environment:
      NODE_ID: 2
      PORT: 50051
      RAFT_DB_PATH: /data/raft.db
      AUTH_DB_PATH: /authdata/users.db
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      LLM_SERVER_ADDRESS: ${LLM_SERVER_ADDRESS:-llm:50052}
    ports:
      - "50052:50051"
    volumes:
      - node2_data:/data
      - auth_data:/authdata
    depends_on:
      - llm
    restart: unless-stopped

  node3:
    build: .
    command: python -m application.server
    environment:
      NODE_ID: 3
      PORT: 50051
      RAFT_DB_PATH: /data/raft.db
      AUTH_DB_PATH: /authdata/users.db
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      LLM_SERVER_ADDRESS: ${LLM_SERVER_ADDRESS:-llm:50052}
    ports:
      - "50053:50051"
    volumes:
      - node3_data:/data
      - auth_data:/authdata
    depends_on:
      - llm
    restart: unless-stopped

  node4:
    build: .
    command: python -m application.server
    environment:
      NODE_ID: 4
      PORT: 50051
      RAFT_DB_PATH: /data/raft.db
      AUTH_DB_PATH: /authdata/users.db
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      LLM_SERVER_ADDRESS: ${LLM_SERVER_ADDRESS:-llm:50052}
    ports:
      - "50054:50051"
    volumes:
      - node4_data:/data
      - auth_data:/authdata
    depends_on:
      - llm
    restart: unless-stopped

  node5:
    build: .
    command: python -m application.server
    environment:
      NODE_ID: 5
      PORT: 50051
      RAFT_DB_PATH: /data/raft.db
      AUTH_DB_PATH: /authdata/users.db
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      LLM_SERVER_ADDRESS: ${LLM_SERVER_ADDRESS:-llm:50052}
    ports:
      - "50055:50051"
    volumes:
      - node5_data:/data
      - auth_data:/authdata
    depends_on:
      - llm
    restart: unless-stopped

  llm:
    build: .
    command: python -m llm.server
    ports:
      - "50056:50052"
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      LLM_MODEL: ${LLM_MODEL:-llama3.2:3b}
      LLM_THINKING: ${LLM_THINKING:-0}
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    command: uvicorn web.app:app --host 0.0.0.0 --port 8000
    environment:
      AUTH_DB_PATH: /authdata/users.db
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      AUCTION_ENDPOINTS: node1:50051,node2:50051,node3:50051,node4:50051,node5:50051
    ports:
      - "8000:8000"
    volumes:
      - auth_data:/authdata
    depends_on:
      - node1
      - node2
      - node3
      - node4
      - node5
    restart: unless-stopped

volumes:
  node1_data:
  node2_data:
  node3_data:
  node4_data:
  node5_data:
  auth_data:
